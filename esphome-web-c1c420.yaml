esphome:
  name: esphome-web-c1c420
  friendly_name: Esphole
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

#wifi:
#  ssid: "HomeAlone5"
#  password: tinku@123

ethernet:
  type: ENC28J60
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13
  cs_pin: GPIO10
  interrupt_pin: GPIO4
